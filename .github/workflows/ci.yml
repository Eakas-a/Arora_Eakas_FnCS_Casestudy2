name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  build-and-test:
    name: Build, Test & Coverage
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: java-assignment

    # A real Postgres, started directly by the workflow and running for the
    # whole job, on a fixed port with fixed credentials. This is deliberately
    # NOT Quarkus Dev Services and NOT a Testcontainers-managed container
    # started from test code — both were tried and both turned out to be
    # unreliable for the packaged jar that @QuarkusIntegrationTest launches as
    # a separate process (see application.properties for the history). A
    # plain `services:` container avoids that class of problem entirely:
    # nothing needs to detect, provision, or propagate anything - the
    # database is just already there, the whole time, exactly like it would
    # be for any other "point at a real Postgres" service.
    services:
      postgres:
        image: postgres:14
        ports:
          - 15432:5432
        env:
          POSTGRES_DB: quarkus_test
          POSTGRES_USER: quarkus_test
          POSTGRES_PASSWORD: quarkus_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Grant execute permission for mvnw
        run: chmod +x mvnw

      - name: Build and run unit + integration tests with coverage
        run: ./mvnw -B clean verify

      # Note: the 80% line coverage threshold is already enforced above,
      # as part of "./mvnw -B clean verify" (the jacoco-check execution
      # bound to the verify phase in pom.xml). Running "jacoco:check" as
      # a standalone goal here does not pick up that execution's <rules>
      # configuration, and fails with "parameters 'rules' ... missing or
      # invalid" — so this step was removed rather than fixed in place.

      - name: Publish JaCoCo coverage report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: java-assignment/target/site/jacoco/
          retention-days: 30

      - name: Publish surefire/failsafe test reports artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            java-assignment/target/surefire-reports/
            java-assignment/target/failsafe-reports/
          retention-days: 30

      - name: Coverage summary in job output
        if: always()
        run: |
          echo "### Coverage Report" >> "$GITHUB_STEP_SUMMARY"
          if [ -f target/site/jacoco/jacoco.csv ]; then
            awk -F"," 'BEGIN { instructions = 0; covered = 0 } { instructions += $4 + $5; covered += $5 } END { if (instructions > 0) printf "Line-level instruction coverage: %.2f%%\n", 100*covered/instructions }' \
              target/site/jacoco/jacoco.csv >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No jacoco.csv found." >> "$GITHUB_STEP_SUMMARY"
          fi
