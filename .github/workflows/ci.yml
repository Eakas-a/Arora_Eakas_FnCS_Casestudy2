name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  build-and-test:
    name: Build, Test & Coverage
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: java-assignment

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Grant execute permission for mvnw
        run: chmod +x mvnw

      # Docker is required here because Quarkus Dev Services will
      # transparently spin up a Postgres test container for the
      # @QuarkusTest / @QuarkusIntegrationTest suite. GitHub's
      # ubuntu-latest runners ship Docker pre-installed.
      - name: Build and run unit + integration tests with coverage
        run: ./mvnw -B clean verify

      - name: Enforce coverage threshold (80% line coverage)
        run: ./mvnw -B jacoco:check

      - name: Publish JaCoCo coverage report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: java-assignment/target/site/jacoco/
          retention-days: 30

      - name: Publish surefire/failsafe test reports artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            java-assignment/target/surefire-reports/
            java-assignment/target/failsafe-reports/
          retention-days: 30

      - name: Coverage summary in job output
        if: always()
        run: |
          echo "### Coverage Report" >> "$GITHUB_STEP_SUMMARY"
          if [ -f target/site/jacoco/jacoco.csv ]; then
            awk -F"," '{ instructions += $4 + $5; covered += $5 } END
              { printf "Line-level instruction coverage: %.2f%%\n", 100*covered/instructions }' \
              target/site/jacoco/jacoco.csv >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No jacoco.csv found." >> "$GITHUB_STEP_SUMMARY"
          fi
