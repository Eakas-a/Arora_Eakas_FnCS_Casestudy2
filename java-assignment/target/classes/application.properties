# %prod points at a real Postgres that CI itself starts and keeps running for
# the whole job (see the `services:` block in ci.yml), on a fixed host/port
# with fixed credentials matching that service exactly. devservices.enabled
# is explicitly false so Quarkus never tries to detect/auto-provision
# anything of its own on top of this.
#
# Two earlier approaches were tried here and both turned out unreliable for
# the packaged jar that @QuarkusIntegrationTest launches as a separate
# process: (1) leaving datasource config unset/partial and hoping Quarkus Dev
# Services would auto-provision a container - sometimes it did, sometimes it
# failed outright with "Datasource '<default>' is not configured"; (2) a
# WarehousePostgresTestResource (Testcontainers, started from test code via
# @QuarkusTestResource) - its config was never observed to reach the launched
# jar's process at all. A plain, always-on service container removes that
# whole class of problem: nothing needs to detect, provision, or propagate
# anything at runtime.
%prod.quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.username=quarkus_test
%prod.quarkus.datasource.password=quarkus_test
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:15432/quarkus_test
%prod.quarkus.datasource.jdbc.max-size=8
%prod.quarkus.datasource.jdbc.min-size=2
%prod.quarkus.datasource.devservices.enabled=false

# Local-only test datasource (in-memory H2), so `mvnw test`/`verify` work without Docker.
# Regular @QuarkusTest classes use this H2 datasource instead of the %prod Postgres above.
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:test;DB_CLOSE_DELAY=-1
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=

quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.log.sql=true
quarkus.hibernate-orm.sql-load-script=import.sql

quarkus.openapi.generator.spec=warehouse-openapi.yaml
quarkus.openapi.generator.base-package=com.warehouse.api